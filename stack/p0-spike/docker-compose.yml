# OpenData → ClickHouse local pipeline.
#
# Components:
#   minio                S3-compatible object store backing the Buffer queue.
#   s3-init           Creates the buffer bucket once MinIO is up.
#   clickhouse           Destination database. DDL in clickhouse-init.sql runs at start.
#   otel-collector       Bundled OpenData distribution; receives OTLP, writes to MinIO via the opendata exporter.
#   clickhouse-ingestor  Reads from the MinIO-backed Buffer, writes rows into ClickHouse.
#   telemetrygen         One-shot OTLP load generator (run on demand: `docker compose run telemetrygen`).
#
# Bring up:        docker compose up -d
# Send some logs:  docker compose run --rm telemetrygen
# Query results:   curl http://localhost:8123 --data-urlencode "query=SELECT count() FROM tutorial.logs"
# Tear down:       docker compose down -v

services:
  # S3-compatible store backing the Buffer queue. RustFS replaces MinIO (MinIO
  # removed its images from Docker Hub/quay in 2026). It must support S3
  # conditional writes (If-None-Match / If-Match): Buffer's manifest relies on them.
  s3:
    image: docker.io/rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: localadmin
      RUSTFS_SECRET_KEY: localadmin-secret
      RUSTFS_SERVER_DOMAINS: s3:9000
    networks:
      default:
        aliases:
          - tutorial-buffer.s3   # virtual-hosted-style bucket host used by the collector's Go S3 client
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - s3-data:/data

  s3-init:
    image: docker.io/amazon/aws-cli:2.31.0
    depends_on:
      - s3
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: localadmin
      AWS_SECRET_ACCESS_KEY: localadmin-secret
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          aws --endpoint-url http://s3:9000 s3api create-bucket --bucket tutorial-buffer >/dev/null 2>&1 \
            || aws --endpoint-url http://s3:9000 s3api head-bucket --bucket tutorial-buffer >/dev/null 2>&1 \
            && { echo "bucket tutorial-buffer ready"; exit 0; }
          sleep 1
        done
        echo "bucket creation failed" >&2; exit 1

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.10.1.2812
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: tutorial
      CLICKHOUSE_USER: ingestor
      CLICKHOUSE_PASSWORD: ingestor
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  otel-collector:
    image: ghcr.io/opendata-oss/otel-collector:v0.4.0
    platform: linux/amd64
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: localadmin
      AWS_SECRET_ACCESS_KEY: localadmin-secret
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]

  clickhouse-ingestor:
    image: ghcr.io/opendata-oss/clickhouse-ingestor:0.2.0
    platform: linux/amd64
    depends_on:
      s3-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      # Object store credentials and endpoint (the Rust object_store
      # crate picks these up from the standard AWS env chain).
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: localadmin
      AWS_SECRET_ACCESS_KEY: localadmin-secret
      AWS_ENDPOINT: http://s3:9000
      AWS_ALLOW_HTTP: "true"
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
      # ClickHouse credentials come from env (never the YAML).
      INGESTOR__CLICKHOUSE__USER: ingestor
      INGESTOR__CLICKHOUSE__PASSWORD: ingestor
      RUST_LOG: info,opendata_ingest_runtime=info,clickhouse_ingestor=info
    ports:
      - "9090:9090"   # Prometheus /metrics
    volumes:
      - ./ingestor-config.yaml:/etc/clickhouse-ingestor/config.yaml:ro
    command: ["--config=/etc/clickhouse-ingestor/config.yaml"]

  mongo:
    image: docker.io/library/mongo:7.0
    volumes:
      - mongo-data:/data/db

  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:2.40.0
    depends_on:
      - mongo
      - clickhouse
    environment:
      MONGO_URI: mongodb://mongo:27017/hyperdx
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8080:8080"   # UI
      - "8000:8000"   # API (external API v2)

  # On-demand OTLP load generator. Run with:
  #   docker compose run --rm telemetrygen
  # Defaults: 30 seconds of logs at 1000 rps from one worker.
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    depends_on:
      - otel-collector
    profiles: ["load"]
    command:
      - "logs"
      - "--otlp-endpoint=otel-collector:4317"
      - "--otlp-insecure"
      - "--duration=30s"
      - "--rate=1000"
      - "--workers=1"
      - "--otlp-attributes=service.name=\"tutorial-app\""

volumes:
  mongo-data:
  s3-data:
  clickhouse-data:
