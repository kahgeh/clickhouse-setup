[workspace]
resolver = "2"
members = ["contract", "telemetry", "backend", "web", "loadgen", "trace_macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
tonic-health = "=0.14.6"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-opentelemetry = "0.34.0"
opentelemetry = "=0.33.0"
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "=0.33.0"
opentelemetry-appender-tracing = "=0.33.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
uuid = { version = "=1.26.1", features = ["v4"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
thiserror = "=2.0.18"
futures = "=0.3.34"
syn = { version = "=2.0.119", features = ["full", "visit-mut"] }
quote = "=1.0.47"

contract = { path = "contract" }
telemetry = { path = "telemetry" }
backend = { path = "backend" }
web = { path = "web" }
trace_macros = { path = "trace_macros" }
